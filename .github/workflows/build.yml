name: Compilar mod (zip a jar)

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Buscar y descomprimir el zip del mod
        run: |
          ZIP=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No se encontro ningun archivo .zip en el repositorio"
            exit 1
          fi
          echo "Usando: $ZIP"
          mkdir -p _mod
          unzip -q -o "$ZIP" -d _mod
          GRADLE_FILE=$(find _mod -maxdepth 3 -name build.gradle | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "El zip no contiene build.gradle"
            exit 1
          fi
          echo "MOD_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Compilar
        run: |
          cd "$MOD_DIR"
          gradle build --no-daemon --stacktrace

      - name: Subir el jar
        uses: actions/upload-artifact@v4
        with:
          name: rincones-kawaii-jar
          path: ${{ env.MOD_DIR }}/build/libs/*.jar
          if-no-files-found: error
